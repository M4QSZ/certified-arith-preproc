[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-arith-preproc"
version = "0.1.0"
description = "VeriPB-certified arithmetic adder extraction, Veronese dual annihilator synthesis, and coupled sparse Macaulay / cutting-planes preprocessing for scrambled 3-CNF formulas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "python-sat>=1.8.dev13",
]

[project.optional-dependencies]
benchmarks = [
    "pycryptosat>=5.11",
]

[project.scripts]
cap-veripb = "certified_arith_preproc.veripb_emitter:main"
cap-bench = "certified_arith_preproc.benchmark_solvers:main"

[tool.setuptools.packages.find]
where = ["src"]
