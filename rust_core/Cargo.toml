[package]
name = "cap-veronese-rs"
version = "0.5.0"
edition = "2021"
description = "Native Rust VeriPB 3.0 proof emitter for blind higher-order Reed-Muller RM(d, n) (d <= 4), Z-adder telescoping, Macaulay binomial ideal lift, local-intersection Zassenhaus ray rewriting, and guarded Cutting-Planes decomposition."
license = "MIT"

[[bin]]
name = "cap-veronese-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
